openapi: 3.0.0
info:
  title: Módulo de Especialidades
  version: 1.0.0
paths:
  /especialidades:
    get:
      summary: Obtener todas las especialidades
      tags: [Especialidades]
      responses:
        200:
          description: Lista de especialidades recuperada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito:
                    type: boolean
                  datos:
                    type: array
                    items:
                      type: object
                      properties:
                        id_especialidad:
                          type: integer
                        nombre:
                          type: string
                        activo:
                          type: integer

    post:
      summary: Crear una nueva especialidad (Solo Admin)
      tags: [Especialidades]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
              properties:
                nombre:
                  type: string
                  example: "ODONTOLOGÍA"
      responses:
        201:
          description: Especialidad creada correctamente
        401:
          description: Token inválido o expirado
        403:
          description: No tienes permisos suficientes (Requiere Rol 3)

  /especialidades/{id}:
    put:
      summary: Actualizar una especialidad por ID (Solo Admin)
      tags: [Especialidades]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID de la especialidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: "TRAUMATOLOGÍA INFANTIL"
                activo:
                  type: integer
                  example: 1
      responses:
        200:
          description: Especialidad actualizada con éxito
        401:
          description: Token inválido o expirado
        403:
          description: No tienes permisos suficientes

    delete:
      summary: Eliminar una especialidad por ID (Solo Admin)
      tags: [Especialidades]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID de la especialidad a dar de baja
      responses:
        200:
          description: Especialidad eliminada con éxito (borrado lógico)
        401:
          description: Token inválido o expirado
        403:
          description: No tienes permisos suficientes (Requiere Rol 3)
        404:
          description: Especialidad no encontrada
