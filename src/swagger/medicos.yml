openapi: 3.0.0
info:
  title: Módulo de Médicos
  version: 1.0.0
paths:
  /medicos/turnos/propios:
    get:
      summary: Obtener todos los turnos propios del médico
      tags:
        - Medicos
      security:
        - BearerAuth: []
      responses:
        200:
          description: Lista de turnos recuperada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "Turnos propios recuperados con éxito"
                  datos:
                    type: array
                    items:
                      type: object
                      properties:
                        id_turno_reserva:
                          type: integer
                          example: 12
                        fecha_hora:
                          type: string
                          example: "2026-06-25 16:00:00"
                        paciente_nombre:
                          type: string
                          example: "ALFONSO, CARLOS"
                        valor_total:
                          type: number
                          example: 12000.00
                        atentido:
                          type: integer
                          example: 0
        401:
          description: No autorizado - Token ausente o inválido
        403:
          description: Prohibido - No tenés los permisos de Médico

  /turnos/{id}/atendido:
    patch:
      summary: Marcar un turno como atendido
      tags:
        - Medicos
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID numérico del turno reserva que se desea atender
          schema:
            type: integer
            example: 12
      responses:
        200:
          description: El turno fue marcado como atendido con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "El turno N° 12 fue marcado como atendido."
                  datos:
                    type: "null"
                    example: null
        400:
          description: Solicitud incorrecta (ej. el turno no existe, está inactivo o ya fue atendido)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito:
                    type: boolean
                    example: false
                  mensaje:
                    type: string
                    example: "El turno no existe, ya fue atendido o se encuentra inactivo."
        401:
          description: No autorizado - Token inválido o ausente
        403:
          description: Prohibido - Requiere rol de Médico
 