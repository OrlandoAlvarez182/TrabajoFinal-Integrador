openapi: 3.0.0
info:
  title: Módulo de Médicos
  version: 1.0.0
paths:
  /especialidad/{nombreEspecialidad}:
    get:
      summary: Listar médicos por nombre de especialidad (Solo Rol 2)
      tags:
        - Especialidades
      security:
        - BearerAuth: []
      parameters:
        - name: nombreEspecialidad
          in: path
          required: true
          description: Nombre de la especialidad a buscar (ej. Pediatria)
          schema:
            type: string
            example: "Pediatria"
      responses:
        200:
          description: Médicos de la especialidad recuperados con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "Médicos de la especialidad Pediatria recuperados con éxito."
                  datos:
                    type: array
                    items:
                      type: object
                      properties:
                        id_medico:
                          type: integer
                          example: 3
                        matricula:
                          type: integer
                          example: 4852
                        descripcion:
                          type: string
                          example: "Atención de pacientes pediátricos."
                        valor_consulta:
                          type: number
                          example: 15000.00
                        apellido:
                          type: string
                          example: "PÉREZ"
                        nombres:
                          type: string
                          example: "JUAN CARLOS"
                        email:
                          type: string
                          example: "juan.perez@correo.com"
                        foto_path:
                          type: string
                          example: ""
        400:
          description: La especialidad enviada en la URL no es válida
        401:
          description: Token inválido o ausente
        403:
          description: Permisos insuficientes (Requiere Rol 2)

  /medicos/turnos:
    get:
      summary: Obtener todos los turnos propios del médico
      tags:
        - Medicos
      security:
        - BearerAuth: []
      responses:
        200:
          description: Lista de turnos recuperada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "Turnos propios recuperados con éxito"
                  datos:
                    type: array
                    items:
                      type: object
                      properties:
                        id_turno_reserva:
                          type: integer
                          example: 12
                        fecha_hora:
                          type: string
                          example: "2026-06-25 16:00:00"
                        paciente_nombre:
                          type: string
                          example: "ALFONSO, CARLOS"
                        valor_total:
                          type: number
                          example: 12000.00
                        atentido:
                          type: integer
                          example: 0
        401:
          description: No autorizado - Token ausente o inválido
        403:
          description: Prohibido - No tenés los permisos de Médico

  /turnos/{id}/atendido:
    patch:
      summary: Marcar un turno como atendido
      tags:
        - Medicos
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID numérico del turno reserva que se desea atender
          schema:
            type: integer
            example: 12
      responses:
        200:
          description: El turno fue marcado como atendido con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "El turno N° 12 fue marcado como atendido."
                  datos:
                    type: "null"
                    example: null
        400:
          description: Solicitud incorrecta (ej. el turno no existe, está inactivo o ya fue atendido)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito:
                    type: boolean
                    example: false
                  mensaje:
                    type: string
                    example: "El turno no existe, ya fue atendido o se encuentra inactivo."
        401:
          description: No autorizado - Token inválido o ausente
        403:
          description: Prohibido - Requiere rol de Médico

  /medicos/{id_medico}/especialidad:
    patch:
      summary: Actualizar la especialidad de un médico (Solo Admin)
      tags:
        - Médicos
      security:
        - BearerAuth: []
      parameters:
        - name: id_medico
          in: path
          required: true
          schema:
            type: integer
          description: ID del médico a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_especialidad:
                  type: integer
                  example: 4
      responses:
        200:
          description: Especialidad del médico actualizada correctamente.
        400:
          description: El campo id_especialidad es obligatorio.
        404:
          description: Médico no encontrado o inactivo.

  /medicos/{id_medico}/obras-sociales:
    post:
      summary: Asociar múltiples obras sociales a un médico (Rol 3)
      tags:
        - Médicos
      security:
        - BearerAuth: []
      parameters:
        - name: id_medico
          in: path
          required: true
          schema:
            type: integer
          description: ID del médico al que se le asignan las obras sociales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                obras_sociales:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        200:
          description: Obras sociales asociadas correctamente.
        400:
          description: Arreglo de obras_sociales inválido o vacío.
        401:
          description: Token inválido o ausente.
        403:
          description: Permisos insuficientes (Requiere Rol 3).
